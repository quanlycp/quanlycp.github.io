name: Sync from qtd
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf _qtd_src
          git clone --depth 1 https://github.com/quytindungbn/qtd.git _qtd_src
          rsync -a --exclude='.git' --exclude='.github' _qtd_src/ ./
          rm -rf _qtd_src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync from qtd"
          git push
